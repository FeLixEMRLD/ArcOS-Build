name: Build ArcOS V0.1-ALPHA (A16 GMS)

on:
  workflow_dispatch: # This gives you a manual "Run" button on GitHub
    inputs:
      gsi_url:
        description: 'Direct download link to base Android 16 GMS GSI (.xz or .gz)'
        required: true
        default: 'PASTE_DIRECT_LINK_HERE'

jobs:
  build-arcos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free up Disk Space (Crucial for GitHub Actions)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Install Android Image Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils wget unzip e2fsprogs

      - name: Download & Extract Base A16 GSI
        run: |
          mkdir -p work
          cd work
          echo "Downloading Base GSI..."
          wget -O base_gsi.img.xz "${{ github.event.inputs.gsi_url }}"
          echo "Extracting..."
          unxz base_gsi.img.xz
          mv base_gsi.img system.img

      - name: Mount & Modify into ArcOS
        run: |
          cd work
          # Expand image slightly to allow space for custom additions
          e2fsck -f -y system.img || true
          resize2fs system.img +200M
          
          # Mount the Android system image
          mkdir -p mnt
          sudo mount -o loop,rw system.img mnt

          # Inject ArcOS V0.1-ALPHA Branding into build.prop
          echo "Injecting ArcOS Versioning..."
          sudo bash -c 'cat <<EOF >> mnt/system/build.prop

          # =====================================
          # ArcOS Custom Properties
          # =====================================
          ro.arcos.version=V0.1-ALPHA
          ro.arcos.codename=alpha
          ro.arcos.maintainer=ArcOS-Team
          ro.build.display.id=ArcOS V0.1-ALPHA (emerald-GSI)
          ro.modversion=ArcOS-V0.1-ALPHA
          EOF'

          # Unmount and clean up image
          sudo umount mnt
          e2fsck -f -y system.img || true
          resize2fs -M system.img

      - name: Package for DSU Sideloader
        run: |
          cd work
          zip -r9 ArcOS-V0.1-ALPHA-A16-emerald-DSU.zip system.img

      - name: Upload ArcOS Build to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ArcOS-V0.1-ALPHA-A16-DSU
          path: work/ArcOS-V0.1-ALPHA-A16-emerald-DSU.zip
