name: Build ArcOS V0.1-ALPHA (emerald)

on:
  workflow_dispatch:
    inputs:
      base_gsi_url:
        description: 'Direct Download Link to A16 GMS Base (.img.xz)'
        required: true
        default: 'https://github.com/ponces/treble_aosp/releases/download/v2025.06.25/aosp-arm64-ab-gapps-16.0-20250625.img.xz'

permissions:
  contents: write

jobs:
  build-arcos:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Up Server Disk Space (Gives ~70GB Free)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Install Android Image Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils gzip e2fsprogs android-sdk-libsparse-utils curl jq wget

      - name: Download Android 16 GMS Base
        run: |
          echo "Downloading Android 16 GMS Base..."
          wget -O base_rom.img.xz "${{ github.event.inputs.base_gsi_url }}"
          echo "Extracting .xz archive..."
          unxz -T0 base_rom.img.xz
          mv base_rom.img system.img

      - name: Convert & Expand System Image for Modification
        run: |
          # Check if image is sparse; if so, convert to raw ext4
          file system.img | grep -q "sparse" && simg2img system.img system_raw.img && mv system_raw.img system.img || true
          
          # Add 500MB headroom so we can add custom ArcOS apps/frameworks later
          dd if=/dev/zero bs=1M count=500 >> system.img
          e2fsck -fy system.img || true
          resize2fs system.img

      - name: Mount & Inject ArcOS V0.1-ALPHA (alpha)
        run: |
          mkdir -p mnt
          sudo mount -o loop,rw system.img mnt

          echo "Injecting ArcOS OEM Properties..."
          # Locate build.prop
          PROP_FILE="mnt/system/build.prop"
          if [ ! -f "$PROP_FILE" ]; then PROP_FILE="mnt/build.prop"; fi

          # Append ArcOS Versioning & Emerald Optimizations
          sudo bash -c "cat << 'EOF' >> $PROP_FILE

          # ==========================================
          # ArcOS OEM Properties
          # ==========================================
          ro.arcos.version=ArcOS V0.1-ALPHA
          ro.arcos.codename=alpha
          ro.arcos.device=emerald
          ro.arcos.build.type=OEM-Alpha
          ro.build.display.id=ArcOS V0.1-ALPHA (alpha)

          # Redmi Note 13 Pro 4G (emerald / Helio G99) Fixes
          ro.surface_flinger.set_idle_timer_ms=80
          ro.surface_flinger.set_touch_timer_ms=200
          persist.sys.usb.config=mtp,adb
          ro.adb.secure=0
          EOF"

          # Create a custom OEM folder for future ArcOS Frameworks/Launchers
          sudo mkdir -p mnt/system/priv-app/ArcOSLauncher
          sudo mkdir -p mnt/product/overlay/ArcOSFrameworkOverlay

          # Unmount cleanly
          sudo umount mnt

      - name: Shrink & Optimize Image for DSU Sideloader
        run: |
          e2fsck -fy system.img || true
          resize2fs -M system.img
          e2fsck -fy system.img || true
          
          # Rename to raw system.img (Required by DSU Sideloader inside .gz)
          mv system.img ArcOS-V0.1-ALPHA-emerald-A16-GMS.img

      - name: Package as .img.gz (Fast/Safe Compression, No .zip!)
        run: |
          echo "Compressing into .img.gz..."
          # Using -1 (fast compression) prevents DSU Sideloader decompression hangs
          gzip -1 -k ArcOS-V0.1-ALPHA-emerald-A16-GMS.img
          ls -lh ArcOS-V0.1-ALPHA-emerald-A16-GMS.img.gz

      - name: Publish ArcOS Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1-alpha-${{ github.run_number }}
          name: "ArcOS V0.1-ALPHA (Codename: alpha) - Build #${{ github.run_number }}"
          body: |
            ### ArcOS V0.1-ALPHA (`alpha`)
            * **Target Device:** Redmi Note 13 Pro 4G (`emerald`)
            * **Base:** Android 16 (GMS Included)
            * **Format:** `.img.gz` (No `.zip` wrapper, optimized for DSU Sideloader)
            * **Pre-configured:** ADB insecure enabled for boot debugging, `emerald` display refresh timers applied.
          files: |
            ArcOS-V0.1-ALPHA-emerald-A16-GMS.img.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
