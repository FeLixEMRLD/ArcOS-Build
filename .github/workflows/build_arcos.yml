name: Build ArcOS V0.1-ALPHA

on:
  workflow_dispatch: # Allows you to trigger the build manually via a button click

permissions:
  contents: write

jobs:
  build:
    name: Build ArcOS System Image
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout ArcOS Source Tree
        uses: actions/checkout@v4

      - name: Install Android Build & Filesystem Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-libsparse-utils e2fsprogs simg2img img2simg gzip wget

      - name: Make Scripts Executable
        run: |
          chmod +x scripts/build_arcos.sh

      - name: Run ArcOS Engine
        run: |
          ./scripts/build_arcos.sh

      - name: Create GitHub Release and Upload Image
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1-ALPHA
          name: "ArcOS V0.1-ALPHA (emerald)"
          body: |
            ### ArcOS V0.1-ALPHA
            - **Target Device:** Redmi Note 13 Pro 4G (`emerald`)
            - **Chipset:** MediaTek Helio G99 Ultra
            - **Base:** Android 16 (GMS Ready)
            - **Installation Target:** DSU Sideloader
            
            #### Applied Fixes:
            - Calibrated LCD Density: `440 DPI`
            - Notch & Status Bar Padding: `104px`
            - 120Hz refresh-rate scheduling enabled
            - Helio G99 backlight curve fix
          files: ArcOS-V0.1-ALPHA-emerald.img.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
